<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cura di Me - Storie</title>
  <link rel="icon" type="image/jpeg" href="curadime.jpeg">
  
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0a0f0d 0%, #071318 50%, #051a15 100%);
      --card-bg: rgba(18, 30, 26, 0.65);
      --card-border: rgba(46, 204, 113, 0.25);
      --text-main: #e8f5e9;
      --text-muted: #a3c2b5;
      --accent-green: #2ecc71;
      --accent-green-glow: rgba(46, 204, 113, 0.4);
      --btn-blue-glass: rgba(41, 128, 185, 0.35);
      --btn-blue-border: rgba(52, 152, 219, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 30px 20px;
    }

    .container {
      background: var(--card-bg);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border: 1px solid var(--card-border);
      width: 100%;
      max-width: 650px;
      padding: 35px 25px;
      border-radius: 24px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
    }

    h1, h2 {
      text-align: center;
      color: #ffffff;
      text-shadow: 0 0 10px rgba(46, 204, 113, 0.3);
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 25px;
    }

    .story-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 30px;
    }

    textarea, input[type="text"] {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    textarea {
      height: 120px;
      resize: vertical;
      margin-bottom: 12px;
    }

    textarea:focus, input[type="text"]:focus {
      border-color: var(--accent-green);
      box-shadow: 0 0 10px var(--accent-green-glow);
    }

    .btn {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid rgba(46, 204, 113, 0.6);
      background: rgba(46, 204, 113, 0.35);
      color: #38ef7d;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s;
    }

    .btn:hover {
      background: rgba(46, 204, 113, 0.6);
      color: #fff;
      box-shadow: 0 0 15px var(--accent-green-glow);
    }

    .story-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 15px;
    }

    .story-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--accent-green);
      margin-bottom: 8px;
    }

    .story-text {
      font-size: 0.95rem;
      line-height: 1.5;
      color: var(--text-main);
    }

    .admin-note-box {
      margin-top: 12px;
      padding: 12px 15px;
      background: rgba(46, 204, 113, 0.12);
      border-left: 3px solid var(--accent-green);
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(46, 204, 113, 0.15);
    }

    .admin-note-header {
      font-size: 0.8rem;
      font-weight: bold;
      color: #38ef7d;
      margin-bottom: 4px;
    }

    .admin-note-text {
      font-size: 0.9rem;
      color: #e8f5e9;
      line-height: 1.4;
    }

    .admin-controls {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .admin-actions {
      display: flex;
      gap: 10px;
    }

    .btn-approve {
      background: rgba(46, 204, 113, 0.4);
      border: 1px solid var(--accent-green);
      color: #fff;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
    }

    .btn-delete {
      background: rgba(231, 76, 60, 0.4);
      border: 1px solid #e74c3c;
      color: #fff;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
    }

    .admin-panel {
      border: 1px dashed var(--accent-green);
      padding: 15px;
      border-radius: 16px;
      margin-bottom: 25px;
      background: rgba(46, 204, 113, 0.05);
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #3498db;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <main class="container">
    <h1>Storie della Community</h1>
    <p class="subtitle">Spazio di ascolto e condivisione anonima.</p>

    <section class="story-box">
      <h3 style="margin-bottom: 10px;">Racconta la tua storia</h3>
      <textarea id="storyInput" placeholder="Scrivi qui... La tua storia rimarrà riservata finché non verrà approvata da un moderatore."></textarea>
      <button id="sendBtn" class="btn">Invia Storia Anonima</button>
      <div id="statusMsg" style="margin-top: 10px; font-size: 0.85rem; text-align: center;"></div>
    </section>

    <section id="adminSection" class="admin-panel" style="display: none;">
      <h2>Pannello Admin</h2>
      <p class="subtitle">Storie in attesa di approvazione:</p>
      <div id="pendingStoriesList"></div>
    </section>

    <h2>Storie Pubblicate</h2>
    <div id="publishedStoriesList" style="margin-top: 15px;"></div>

    <a href="index.html" class="back-link">← Torna alla Home</a>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, collection, addDoc, getDocs, query, where, updateDoc, deleteDoc, doc, serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyACDhEfI-bOGmGlO2z_-QwOexXV3UAKcIo",
      authDomain: "curadite-6d9f9.firebaseapp.com",
      projectId: "curadite-6d9f9",
      storageBucket: "curadite-6d9f9.firebasestorage.app",
      messagingSenderId: "822428953344",
      appId: "1:822428953344:web:a943ae406889943d4021e5"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const ADMIN_UIDS = [
      "KPs3CF0LcVhpteRaqigaubP1S9l1",
      "YeRauosaTfZS7hbySLdtNXgSHV22"
    ];

    let currentUser = null;

    onAuthStateChanged(auth, async (user) => {
      currentUser = user;

      if (user) {
        document.querySelector('.subtitle').textContent = `Connesso come: ${user.displayName || user.email}`;
        
        if (ADMIN_UIDS.includes(user.uid)) {
          document.getElementById('adminSection').style.display = 'block';
          loadPendingStories();
        }
      }
      loadPublishedStories();
    });

    document.getElementById('sendBtn').addEventListener('click', async () => {
      const text = document.getElementById('storyInput').value.trim();
      const statusMsg = document.getElementById('statusMsg');

      if (!currentUser) {
        statusMsg.textContent = "Devi prima accedere con il tuo account dalla pagina Account!";
        statusMsg.style.color = "#e74c3c";
        return;
      }

      if (!text) return;

      try {
        await addDoc(collection(db, "stories"), {
          text: text,
          author: currentUser.displayName || "Anonimo",
          authorEmail: currentUser.email,
          approved: false,
          adminNote: "",
          createdAt: serverTimestamp()
        });

        document.getElementById('storyInput').value = "";
        statusMsg.textContent = "Storia inviata con successo! Sarà visibile appena approvata.";
        statusMsg.style.color = "#38ef7d";
      } catch (e) {
        statusMsg.textContent = "Errore nell'invio: " + e.message;
        statusMsg.style.color = "#e74c3c";
      }
    });

    async function loadPublishedStories() {
      const list = document.getElementById('publishedStoriesList');
      list.innerHTML = "";
      try {
        const q = query(collection(db, "stories"), where("approved", "==", true));
        const querySnapshot = await getDocs(q);

        querySnapshot.forEach((docSnap) => {
          const data = docSnap.data();
          const card = document.createElement('div');
          card.className = 'story-card';

          let noteHTML = "";
          if (data.adminNote && data.adminNote.trim() !== "") {
            noteHTML = `
              <div class="admin-note-box">
                <div class="admin-note-header">★ Nota di Fronte ★</div>
                <div class="admin-note-text">${data.adminNote}</div>
              </div>
            `;
          }

          let deleteBtnHTML = "";
          if (currentUser && ADMIN_UIDS.includes(currentUser.uid)) {
            deleteBtnHTML = `
              <div class="admin-controls" style="margin-top:10px;">
                <button class="btn-delete" onclick="deleteStory('${docSnap.id}')">Elimina Storia Pubblicata</button>
              </div>
            `;
          }

          card.innerHTML = `
            <div class="story-header">
              <span>Autore: ${data.author}</span>
            </div>
            <p class="story-text">${data.text}</p>
            ${noteHTML}
            ${deleteBtnHTML}
          `;
          list.appendChild(card);
        });
      } catch (err) {
        console.error("Errore caricamento storie pubblicate:", err);
      }
    }

    async function loadPendingStories() {
      const list = document.getElementById('pendingStoriesList');
      list.innerHTML = "";
      try {
        const q = query(collection(db, "stories"), where("approved", "==", false));
        const querySnapshot = await getDocs(q);

        querySnapshot.forEach((docSnap) => {
          const data = docSnap.data();
          const card = document.createElement('div');
          card.className = 'story-card';
          card.innerHTML = `
            <div class="story-header">
              <span>Autore: ${data.author} (${data.authorEmail})</span>
            </div>
            <p class="story-text">${data.text}</p>
            <div class="admin-controls">
              <input type="text" id="note-${docSnap.id}" placeholder="Nota/Risposta dell'Admin (opzionale)...">
              <div class="admin-actions">
                <button class="btn-approve" onclick="approveStory('${docSnap.id}')">Pubblica</button>
                <button class="btn-delete" onclick="deleteStory('${docSnap.id}')">Elimina</button>
              </div>
            </div>
          `;
          list.appendChild(card);
        });
      } catch (err) {
        console.error("Errore caricamento storie in attesa:", err);
      }
    }

    window.approveStory = async (id) => {
      const noteInput = document.getElementById(`note-${id}`);
      const adminNote = noteInput ? noteInput.value.trim() : "";

      await updateDoc(doc(db, "stories", id), { 
        approved: true,
        adminNote: adminNote 
      });
      loadPendingStories();
      loadPublishedStories();
    };

    window.deleteStory = async (id) => {
      if (confirm("Vuoi davvero eliminare questa storia?")) {
        await deleteDoc(doc(db, "stories", id));
        if (currentUser && ADMIN_UIDS.includes(currentUser.uid)) {
          loadPendingStories();
        }
        loadPublishedStories();
      }
    };
  </script>
</body>
</html>
