<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cura di Me - Account</title>
  <link rel="icon" type="image/jpeg" href="curadime.jpeg">
  
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0a0f0d 0%, #071318 50%, #051a15 100%);
      --card-bg: rgba(18, 30, 26, 0.65);
      --card-border: rgba(46, 204, 113, 0.25);
      --text-main: #e8f5e9;
      --text-muted: #a3c2b5;
      
      --accent-green: #2ecc71;
      --accent-green-glow: rgba(46, 204, 113, 0.4);
      --accent-green-hover: rgba(46, 204, 113, 0.6);
      
      --btn-blue-text: #3498db;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      overflow-x: hidden;
    }

    .container {
      background: var(--card-bg);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border: 1px solid var(--card-border);
      width: 100%;
      max-width: 420px;
      padding: 40px 25px;
      border-radius: 24px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5),
                  inset 0 1px 1px 0 rgba(255, 255, 255, 0.1);
      text-align: center;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 8px;
      color: #ffffff;
      text-shadow: 0 0 10px rgba(46, 204, 113, 0.3);
    }

    .subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 18px;
      text-align: left;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text-main);
      letter-spacing: 0.5px;
    }

    input {
      width: 100%;
      padding: 13px 15px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      font-size: 1rem;
      color: #ffffff;
      outline: none;
      transition: all 0.25s ease;
    }

    input:focus {
      border-color: var(--accent-green);
      box-shadow: 0 0 10px var(--accent-green-glow);
      background: rgba(255, 255, 255, 0.08);
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: 1px solid rgba(46, 204, 113, 0.6);
      border-radius: 14px;
      background: rgba(46, 204, 113, 0.35);
      color: #38ef7d;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.2),
                  0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .btn:hover {
      background: var(--accent-green-hover);
      color: #ffffff;
      box-shadow: 0 0 20px var(--accent-green-glow),
                  inset 0 1px 1px rgba(255, 255, 255, 0.4);
    }

    .btn:active {
      transform: scale(0.97);
    }

    .back-link {
      display: inline-block;
      margin-top: 25px;
      color: var(--btn-blue-text);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      transition: color 0.2s;
    }

    .back-link:hover {
      color: #5dade2;
      text-decoration: underline;
    }

    .status-msg {
      margin-top: 18px;
      font-size: 0.85rem;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <main class="container">
    <h1>Account Anonimo</h1>
    <p class="subtitle">Accedi o registrati solo con Nickname e Password.</p>

    <form id="auth-form">
      <div class="form-group">
        <label for="nickname">Nickname</label>
        <input type="text" id="nickname" placeholder="Scegli un nickname" required autocomplete="username">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Inserisci la password" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn">Accedi / Registrati</button>
    </form>

    <div id="status" class="status-msg"></div>

    <a href="index.html" class="back-link">← Torna alla Home</a>
  </main>

  <!-- Firebase Modular SDK v10 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";
    import { 
      getAuth, 
      createUserWithEmailAndPassword, 
      signInWithEmailAndPassword, 
      updateProfile 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyACDhEfI-bOGmGlO2z_-QwOexXV3UAKcIo",
      authDomain: "curadite-6d9f9.firebaseapp.com",
      projectId: "curadite-6d9f9",
      storageBucket: "curadite-6d9f9.firebasestorage.app",
      messagingSenderId: "822428953344",
      appId: "1:822428953344:web:a943ae406889943d4021e5",
      measurementId: "G-38GBN96R0H"
    };

    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const auth = getAuth(app);

    const form = document.getElementById('auth-form');
    const statusDiv = document.getElementById('status');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const nickname = document.getElementById('nickname').value.trim();
      const password = document.getElementById('password').value;

      // Pulisce il nickname per creare un'email valida per Firebase (toglie spazi, stelle e caratteri speciali)
      const cleanName = nickname.replace(/[^a-zA-Z0-9]/g, '').toLowerCase();
      const fakeEmail = `${cleanName}@curadime.app`;

      statusDiv.textContent = "Elaborazione in corso...";
      statusDiv.style.color = "var(--text-muted)";

      try {
        const userCredential = await signInWithEmailAndPassword(auth, fakeEmail, password);
        statusDiv.textContent = `Bentornato/a, ${userCredential.user.displayName || nickname}!`;
        statusDiv.style.color = "#38ef7d";
      } catch (loginError) {
        if (loginError.code === 'auth/user-not-found' || loginError.code === 'auth/invalid-credential') {
          try {
            const newUserCredential = await createUserWithEmailAndPassword(auth, fakeEmail, password);
            await updateProfile(newUserCredential.user, { displayName: nickname });
            statusDiv.textContent = `Account creato con successo! Benvenuto/a, ${nickname}.`;
            statusDiv.style.color = "#38ef7d";
          } catch (createError) {
            statusDiv.textContent = "Errore durante la creazione: " + createError.message;
            statusDiv.style.color = "#e74c3c";
          }
        } else {
          statusDiv.textContent = "Errore di accesso: " + loginError.message;
          statusDiv.style.color = "#e74c3c";
        }
      }
    });
  </script>
</body>
</html>
