<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cura di Me - Diario di Bordo</title>
  <link rel="icon" type="image/jpeg" href="curadime.jpeg">
  
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0a0f0d 0%, #071318 50%, #051a15 100%);
      --card-bg: rgba(18, 30, 26, 0.65);
      --card-border: rgba(46, 204, 113, 0.25);
      --text-main: #e8f5e9;
      --text-muted: #a3c2b5;
      --accent-green: #2ecc71;
      --accent-green-glow: rgba(46, 204, 113, 0.4);
      --btn-blue-text: #3498db;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 30px 20px;
    }

    .container {
      background: var(--card-bg);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border: 1px solid var(--card-border);
      width: 100%;
      max-width: 650px;
      padding: 35px 25px;
      border-radius: 24px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
    }

    h1, h2 {
      text-align: center;
      color: #ffffff;
      text-shadow: 0 0 10px rgba(46, 204, 113, 0.3);
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 25px;
    }

    .section-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: var(--accent-green);
      font-size: 0.95rem;
    }

    input[type="number"], input[type="text"], textarea {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    input:focus, textarea:focus {
      border-color: var(--accent-green);
      box-shadow: 0 0 10px var(--accent-green-glow);
    }

    .checkbox-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .checkbox-label:hover {
      background: rgba(46, 204, 113, 0.1);
      border-color: var(--accent-green);
    }

    .checkbox-label input {
      accent-color: var(--accent-green);
    }

    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid rgba(46, 204, 113, 0.6);
      background: rgba(46, 204, 113, 0.35);
      color: #38ef7d;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.25s;
    }

    .btn:hover {
      background: rgba(46, 204, 113, 0.6);
      color: #fff;
      box-shadow: 0 0 15px var(--accent-green-glow);
    }

    .history-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .history-card h3 {
      font-size: 1rem;
      color: var(--accent-green);
      margin-bottom: 6px;
      text-align: left;
    }

    .history-meta {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .tags-container {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .tag {
      background: rgba(52, 152, 219, 0.2);
      border: 1px solid rgba(52, 152, 219, 0.4);
      color: #3498db;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
    }

    .tag-vizio {
      background: rgba(231, 76, 60, 0.2);
      border: 1px solid rgba(231, 76, 60, 0.4);
      color: #e74c3c;
    }

    .tag-emozione {
      background: rgba(155, 89, 182, 0.2);
      border: 1px solid rgba(155, 89, 182, 0.4);
      color: #bb8fce;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 25px;
      color: var(--btn-blue-text);
      text-decoration: none;
    }
  </style>
</head>
<body>

  <main class="container">
    <h1>Diario di Bordo</h1>
    <p class="subtitle" id="userStatus">Il tuo spazio privato e personale</p>

    <!-- Form Giornaliero -->
    <section class="section-card" id="diaryFormSection" style="display: none;">
      <h2>Com'è stata la tua giornata?</h2>
      <p class="subtitle" style="margin-bottom: 15px;">Registra il tuo check-in di oggi (visibile solo a te)</p>

      <div class="form-group">
        <label for="moodScore">Come sei stato oggi da 1 a 10?</label>
        <input type="number" id="moodScore" min="1" max="10" placeholder="Es. 8" required>
      </div>

      <div class="form-group">
        <label>Cosa hai fatto di bello?</label>
        <div class="checkbox-grid" id="cbCose Belle">
          <label class="checkbox-label"><input type="checkbox" name="bello" value="Sport"> Sport</label>
          <label class="checkbox-label"><input type="checkbox" name="bello" value="Hobby"> Hobby</label>
          <label class="checkbox-label"><input type="checkbox" name="bello" value="Lettura"> Lettura</label>
          <label class="checkbox-label"><input type="checkbox" name="bello" value="Relazioni"> Relazioni</label>
          <label class="checkbox-label"><input type="checkbox" name="bello" value="Amici"> Amici</label>
          <label class="checkbox-label"><input type="checkbox" name="bello" value="Famiglia"> Famiglia</label>
          <label class="checkbox-label"><input type="checkbox" name="bello" value="Natura"> Natura</label>
        </div>
      </div>

      <div class="form-group">
        <label>Quali sono i tuoi vizi di oggi?</label>
        <div class="checkbox-grid">
          <label class="checkbox-label"><input type="checkbox" name="vizi" value="Procrastinare"> Procrastinare</label>
          <label class="checkbox-label"><input type="checkbox" name="vizi" value="Fumo"> Fumo</label>
          <label class="checkbox-label"><input type="checkbox" name="vizi" value="Alcol"> Alcol</label>
          <label class="checkbox-label"><input type="checkbox" name="vizi" value="Sfortuna/Altro"> Altro</label>
        </div>
      </div>

      <div class="form-group">
        <label>Cosa hai provato?</label>
        <div class="checkbox-grid">
          <label class="checkbox-label"><input type="checkbox" name="emozioni" value="Felicità"> Felicità</label>
          <label class="checkbox-label"><input type="checkbox" name="emozioni" value="Rabbia"> Rabbia</label>
          <label class="checkbox-label"><input type="checkbox" name="emozioni" value="Tristezza"> Tristezza</label>
          <label class="checkbox-label"><input type="checkbox" name="emozioni" value="Nostalgia"> Nostalgia</label>
          <label class="checkbox-label"><input type="checkbox" name="emozioni" value="Sonno"> Sonno</label>
          <label class="checkbox-label"><input type="checkbox" name="emozioni" value="Stress"> Stress</label>
          <label class="checkbox-label"><input type="checkbox" name="emozioni" value="Noia"> Noia</label>
          <label class="checkbox-label"><input type="checkbox" name="emozioni" value="Gioia"> Gioia</label>
        </div>
      </div>

      <div class="form-group">
        <label for="diaryNotes">Note personali (opzionale):</label>
        <textarea id="diaryNotes" placeholder="Un pensiero veloce sulla giornata..."></textarea>
      </div>

      <button id="saveDiaryBtn" class="btn">Salva Diario di Oggi</button>
      <div id="statusMsg" style="margin-top: 10px; font-size: 0.85rem; text-align: center;"></div>
    </section>

    <!-- Sezione Storico e Statistiche Private -->
    <h2>Il tuo Storico Privato</h2>
    <div id="historyList" style="margin-top: 15px;">
      <p style="text-align: center; color: var(--text-muted);">Accedi per visualizzare il tuo diario personale.</p>
    </div>

    <a href="index.html" class="back-link">← Torna alla Home</a>
  </main>

  <!-- Script Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, collection, addDoc, getDocs, query, where, orderBy, serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyACDhEfI-bOGmGlO2z_-QwOexXV3UAKcIo",
      authDomain: "curadite-6d9f9.firebaseapp.com",
      projectId: "curadite-6d9f9",
      storageBucket: "curadite-6d9f9.firebasestorage.app",
      messagingSenderId: "822428953344",
      appId: "1:822428953344:web:a943ae406889943d4021e5"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;

    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      if (user) {
        document.getElementById('userStatus').textContent = `Connesso come: ${user.email || 'Utente'}`;
        document.getElementById('diaryFormSection').style.display = 'block';
        loadUserDiaries(user.uid);
      } else {
        document.getElementById('userStatus').textContent = "Effettua il login per usare il Diario Privato";
        document.getElementById('diaryFormSection').style.display = 'none';
        document.getElementById('historyList').innerHTML = `<p style="text-align: center; color: var(--text-muted);">Devi effettuare l'accesso per visualizzare i tuoi dati privati.</p>`;
      }
    });

    // Salvataggio Diario
    document.getElementById('saveDiaryBtn').addEventListener('click', async () => {
      if (!currentUser) return;

      const score = document.getElementById('moodScore').value;
      const notes = document.getElementById('diaryNotes').value.trim();
      const statusMsg = document.getElementById('statusMsg');

      if (!score || score < 1 || score > 10) {
        statusMsg.textContent = "Inserisci un voto valido da 1 a 10!";
        statusMsg.style.color = "#e74c3c";
        return;
      }

      // Raccolta checkbox spuntate
      const getChecked = (name) => {
        const checkboxes = document.querySelectorAll(`input[name="${name}"]:checked`);
        return Array.from(checkboxes).map(cb => cb.value);
      };

      const coseBelle = getChecked('bello');
      const vizi = getChecked('vizi');
      const emozioni = getChecked('emozioni');

      // Ottieni la data odierna in formato leggibile
      const todayDateStr = new Date().toLocaleDateString('it-IT', { year: 'numeric', month: '2-digit', day: '2-digit' });

      try {
        await addDoc(collection(db, "diaries"), {
          userId: currentUser.uid, // Fondamentale per la privacy: legato solo a questo utente!
          dateStr: todayDateStr,
          score: Number(score),
          coseBelle: coseBelle,
          vizi: vizi,
          emozioni: emozioni,
          notes: notes,
          createdAt: serverTimestamp()
        });

        statusMsg.textContent = "Diario di oggi salvato con successo!";
        statusMsg.style.color = "#38ef7d";

        // Pulisci i campi
        document.getElementById('moodScore').value = "";
        document.getElementById('diaryNotes').value = "";
        document.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);

        loadUserDiaries(currentUser.uid);
      } catch (err) {
        statusMsg.textContent = "Errore durante il salvataggio: " + err.message;
        statusMsg.style.color = "#e74c3c";
      }
    });

    // Caricamento dello storico privato dell'utente
    async function loadUserDiaries(uid) {
      const historyList = document.getElementById('historyList');
      historyList.innerHTML = "";

      try {
        // Query filtrata rigorosamente per l'utente corrente (Privacy totale)
        const q = query(
          collection(db, "diaries"), 
          where("userId", "==", uid)
        );
        
        const querySnapshot = await getDocs(q);
        let diaries = [];
        querySnapshot.forEach((docSnap) => {
          diaries.push({ id: docSnap.id, ...docSnap.data() });
        });

        // Ordinamento dal più recente al meno recente (basato su data/creazione)
        diaries.sort((a, b) => {
          if (b.createdAt && a.createdAt) {
            return b.createdAt.seconds - a.createdAt.seconds;
          }
          return 0;
        });

        if (diaries.length === 0) {
          historyList.innerHTML = `<p style="text-align: center; color: var(--text-muted);">Nessun diario salvato finora. Inizia oggi!</p>`;
          return;
        }

        diaries.forEach((entry) => {
          const card = document.createElement('div');
          card.className = 'history-card';

          let tagsHTML = "";
          
          if (entry.coseBelle && entry.coseBelle.length > 0) {
            entry.coseBelle.forEach(item => { tagsHTML += `<span class="tag">✨ ${item}</span>`; });
          }
          if (entry.vizi && entry.vizi.length > 0) {
            entry.vizi.forEach(item => { tagsHTML += `<span class="tag tag-vizio">⚠️ ${item}</span>`; });
          }
          if (entry.emozioni && entry.emozioni.length > 0) {
            entry.emozioni.forEach(item => { tagsHTML += `<span class="tag tag-emozione">💙 ${item}</span>`; });
          }

          card.innerHTML = `
            <h3>Voto Giornata: ${entry.score}/10</h3>
            <div class="history-meta">📅 Data: ${entry.dateStr || 'Recente'}</div>
            ${entry.notes ? `<p style="font-size: 0.9rem; margin-bottom: 8px;">"${entry.notes}"</p>` : ""}
            <div class="tags-container">${tagsHTML}</div>
          `;
          historyList.appendChild(card);
        });

      } catch (err) {
        console.error("Errore nel caricamento dello storico:", err);
        historyList.innerHTML = `<p style="text-align: center; color: #e74c3c;">Errore nel caricamento dei dati personali.</p>`;
      }
    }
  </script>
</body>
</html>
